<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>aimesig · auth test</title>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';


// ─────────────────────────────────────────────────────────────
// FIREBASE CONFIG
// ─────────────────────────────────────────────────────────────

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyA8P_eASlAYbsqqR43hJt5cUf8IjeuK_j8",
    authDomain: "aimesig.firebaseapp.com",
    projectId: "aimesig",
    storageBucket: "aimesig.firebasestorage.app",
    messagingSenderId: "229626550217",
    appId: "1:229626550217:web:30d05a774b7f0427bafa18",
    measurementId: "G-QKWLF7N02R"
};

const AUTH_SERVICE = "http://localhost:4001";


// ─────────────────────────────────────────────────────────────
// FIREBASE INIT
// ─────────────────────────────────────────────────────────────

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);

auth.languageCode = 'en';

let confirmationResult = null;


// ─────────────────────────────────────────────────────────────
// RECAPTCHA SETUP
// ─────────────────────────────────────────────────────────────

async function setupRecaptcha() {

  // reuse existing verifier
  if (window._recaptchaVerifier) {
    return window._recaptchaVerifier;
  }

  // clear old dom
  const container = document.getElementById('recaptcha-container');

  if (container) {
    container.innerHTML = '';
  }

  try {

    window._recaptchaVerifier = new RecaptchaVerifier(
      auth,
      'recaptcha-container',
      {
        size: 'invisible',

        callback: () => {
          console.log('reCAPTCHA solved');
        },

        'expired-callback': () => {

          console.log('reCAPTCHA expired');

          if (window._recaptchaVerifier) {
            window._recaptchaVerifier.clear();
            window._recaptchaVerifier = null;
          }
        }
      }
    );

    await window._recaptchaVerifier.render();

    return window._recaptchaVerifier;

  } catch (err) {

    console.error(err);

    if (window._recaptchaVerifier) {
      window._recaptchaVerifier.clear();
      window._recaptchaVerifier = null;
    }

    throw err;
  }
}


// ─────────────────────────────────────────────────────────────
// STEP 1 : SEND OTP
// ─────────────────────────────────────────────────────────────

window.sendOtp = async function () {

  const phone =
    document.getElementById('phone').value.trim();

  if (!phone) {
    return setStatus('Enter phone number', 'error');
  }

  setStatus('Sending OTP...', 'info');

  try {

    const appVerifier = await setupRecaptcha();

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        appVerifier
      );

    setStatus('OTP sent successfully!', 'success');

    show('step2');

    log('OTP sent to ' + phone);

  } catch (err) {

    console.error(err);

    setStatus(
      'Send failed: ' + err.message,
      'error'
    );

    log('ERROR sendOtp: ' + err.message);

    if (window._recaptchaVerifier) {
      window._recaptchaVerifier.clear();
      window._recaptchaVerifier = null;
    }
  }
};


// ─────────────────────────────────────────────────────────────
// STEP 2 : VERIFY OTP
// ─────────────────────────────────────────────────────────────

window.verifyOtp = async function () {

  const code =
    document.getElementById('otp').value.trim();

  if (!code || !confirmationResult) {
    return setStatus('Enter OTP', 'error');
  }

  setStatus('Verifying OTP...', 'info');

  try {

    const credential =
      await confirmationResult.confirm(code);

    const idToken =
      await credential.user.getIdToken();

    window._idToken = idToken;

    log('Firebase Token:\n' + idToken);

    setStatus('OTP verified!', 'success');

    show('step3');

  } catch (err) {

    console.error(err);

    setStatus(
      'OTP verification failed',
      'error'
    );

    log('ERROR verifyOtp: ' + err.message);
  }
};


// ─────────────────────────────────────────────────────────────
// STEP 3 : LOGIN TO BACKEND
// ─────────────────────────────────────────────────────────────

window.login = async function () {

  const username =
    document.getElementById('username').value.trim();

  const idToken = window._idToken;

  if (!idToken) {
    return setStatus(
      'Verify OTP first',
      'error'
    );
  }

  setStatus('Logging in...', 'info');

  try {

    const body = { idToken };

    if (username) {
      body.username = username;
    }

    const res = await fetch(
      `${AUTH_SERVICE}/auth/login`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }
    );

    const data = await res.json();

    if (!res.ok) {

      if (data.newUser) {

        show('username-row');

        setStatus(
          'New user. Enter username.',
          'info'
        );

        return;
      }

      throw new Error(data.error);
    }

    window._accessToken  = data.accessToken;
    window._refreshToken = data.refreshToken;

    log(JSON.stringify(data, null, 2));

    setStatus('Login success!', 'success');

    show('step4');

  } catch (err) {

    console.error(err);

    setStatus(
      'Login failed: ' + err.message,
      'error'
    );

    log('ERROR login: ' + err.message);
  }
};


// ─────────────────────────────────────────────────────────────
// GET PROFILE
// ─────────────────────────────────────────────────────────────

window.getMe = async function () {

  if (!window._accessToken) {
    return setStatus('No access token', 'error');
  }

  try {

    const res = await fetch(
      `${AUTH_SERVICE}/auth/me`,
      {
        headers: {
          Authorization:
            `Bearer ${window._accessToken}`
        }
      }
    );

    const data = await res.json();

    log(JSON.stringify(data, null, 2));

    setStatus('Profile fetched', 'success');

  } catch (err) {

    console.error(err);

    setStatus(err.message, 'error');
  }
};


// ─────────────────────────────────────────────────────────────
// REFRESH TOKEN
// ─────────────────────────────────────────────────────────────

window.refresh = async function () {

  if (!window._refreshToken) {
    return setStatus(
      'No refresh token',
      'error'
    );
  }

  try {

    const res = await fetch(
      `${AUTH_SERVICE}/auth/refresh`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          refreshToken: window._refreshToken
        })
      }
    );

    const data = await res.json();

    window._accessToken = data.accessToken;

    log(JSON.stringify(data, null, 2));

    setStatus('Token refreshed', 'success');

  } catch (err) {

    console.error(err);

    setStatus(err.message, 'error');
  }
};


// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────

function show(id) {
  document.getElementById(id)
    ?.classList.remove('hidden');
}

function setStatus(msg, type) {

  const el = document.getElementById('status');

  el.textContent = msg;

  el.className = 'status ' + type;
}

function log(msg) {

  const el = document.getElementById('log');

  const ts = new Date().toLocaleTimeString();

  el.textContent += `[${ts}] ${msg}\n\n`;

  el.scrollTop = el.scrollHeight;
}

</script>


<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:30px;
}

input{
  width:300px;
  padding:10px;
  margin-top:10px;
}

button{
  padding:10px;
  margin-top:10px;
  width:320px;
}

.hidden{
  display:none;
}

#log{
  margin-top:20px;
  background:#222;
  padding:20px;
  white-space:pre-wrap;
}

.status{
  margin-bottom:20px;
}

.success{
  color:#4ade80;
}

.error{
  color:#f87171;
}

.info{
  color:#22d3ee;
}

</style>

</head>

<body>

<h2>Aimesig Firebase Auth Test</h2>

<div id="status" class="status info">
Ready
</div>


<!-- STEP 1 -->

<div>

<input
  id="phone"
  type="tel"
  placeholder="+91XXXXXXXXXX"
/>

<br>

<button onclick="sendOtp()">
Send OTP
</button>

</div>


<!-- STEP 2 -->

<div id="step2" class="hidden">

<input
  id="otp"
  type="text"
  placeholder="Enter OTP"
/>

<br>

<button onclick="verifyOtp()">
Verify OTP
</button>

</div>


<!-- STEP 3 -->

<div id="step3" class="hidden">

<div id="username-row" class="hidden">

<input
  id="username"
  type="text"
  placeholder="Username"
/>

</div>

<br>

<button onclick="login()">
Login
</button>

</div>


<!-- STEP 4 -->

<div id="step4" class="hidden">

<button onclick="getMe()">
GET /auth/me
</button>

<br>

<button onclick="refresh()">
POST /auth/refresh
</button>

</div>


<!-- LOG -->

<pre id="log"></pre>


<!-- RECAPTCHA -->

<div id="recaptcha-container"></div>

</body>
</html>
